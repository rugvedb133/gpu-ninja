<rect x="20" y="18" width="12" height="12" rx="2" fill="#767C69"/>
<text x="38" y="28" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A3A996">Single GPU</text>
<rect x="150" y="18" width="12" height="12" rx="2" fill="#76B900"/>
<text x="168" y="28" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A3A996">Multi-GPU</text>
