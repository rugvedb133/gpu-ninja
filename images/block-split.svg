<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180" role="img" aria-labelledby="fig1-title fig1-desc" xmlns:c2pa="http://c2pa.org/manifest">
<metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fig1-title">How the multiplication splits across four GPUs</title>
  <desc id="fig1-desc">Matrix A is split into row-blocks A1 and A2. Matrix B is split into column-blocks B1 and B2. Multiplying them produces four quadrants of result matrix C: C1 equals A1 times B1 on GPU 0, C2 equals A1 times B2 on GPU 1, C3 equals A2 times B1 on GPU 2, and C4 equals A2 times B2 on GPU 3.</desc>

  <style>
    .cell-label { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
    .gpu-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; text-anchor: middle; dominant-baseline: middle; }
    .op-symbol { font-family: 'IBM Plex Mono', monospace; font-size: 26px; text-anchor: middle; dominant-baseline: middle; fill: #A3A996; }
  </style>

  <!-- A: split by rows -->
  <rect x="20" y="20" width="68" height="68" rx="6" fill="#1C2216" stroke="#333D28"/>
  <text x="54" y="54" class="cell-label" fill="#E9ECE3">A1</text>
  <rect x="20" y="92" width="68" height="68" rx="6" fill="#1C2216" stroke="#333D28"/>
  <text x="54" y="126" class="cell-label" fill="#E9ECE3">A2</text>

  <text x="185" y="90" class="op-symbol">&#215;</text>

  <!-- B: split by columns (each spans the full height, per \multirow{2} in the source) -->
  <rect x="210" y="20" width="68" height="140" rx="6" fill="#1C2216" stroke="#333D28"/>
  <text x="244" y="90" class="cell-label" fill="#E9ECE3">B1</text>
  <rect x="282" y="20" width="68" height="140" rx="6" fill="#1C2216" stroke="#333D28"/>
  <text x="316" y="90" class="cell-label" fill="#E9ECE3">B2</text>

  <text x="375" y="90" class="op-symbol">=</text>

  <!-- C: 2x2 result, one quadrant per GPU -->
  <rect x="400" y="20" width="68" height="68" rx="6" fill="#3EA6FF"/>
  <text x="434" y="48" class="cell-label" fill="#04263F">C1</text>
  <text x="434" y="66" class="gpu-label" fill="#04263F">GPU 0</text>

  <rect x="472" y="20" width="68" height="68" rx="6" fill="#FFB000"/>
  <text x="506" y="48" class="cell-label" fill="#402C00">C2</text>
  <text x="506" y="66" class="gpu-label" fill="#402C00">GPU 1</text>

  <rect x="400" y="92" width="68" height="68" rx="6" fill="#FF6B6B"/>
  <text x="434" y="120" class="cell-label" fill="#450000">C3</text>
  <text x="434" y="138" class="gpu-label" fill="#450000">GPU 2</text>

  <rect x="472" y="92" width="68" height="68" rx="6" fill="#C77DFF"/>
  <text x="506" y="120" class="cell-label" fill="#2E0A4D">C4</text>
  <text x="506" y="138" class="gpu-label" fill="#2E0A4D">GPU 3</text>
</svg>
