<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" xmlns:c2pa="http://c2pa.org/manifest">
<metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Editable source for images/og-image.png.
    Fonts used: "Space Grotesk" (Bold) for the title, "IBM Plex Mono" (Medium) for the kicker.
    If they're not installed system-wide when you export, install them first
    (e.g. `apt-get install fonts-space-grotesk-ttf fonts-ibm-plex`) or swap in
    equivalents in your editor of choice — otherwise text will fall back to a
    generic sans/mono and won't match the site.
    Export: open in Inkscape/Illustrator/Figma, edit, then export/render at
    1200x630 PNG (or `rsvg-convert -w 1200 -h 1200 og-image.svg -o og-image.png`).
  -->

  <defs>
    <pattern id="tile-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2319" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#161917"/>
  <rect width="1200" height="630" fill="url(#tile-grid)"/>

  <!-- quadrant mark (same geometry as favicon.svg, scaled 2.34375x, positioned at 80,70) -->
  <g transform="translate(80,70) scale(2.34375)">
    <rect width="64" height="64" rx="14" fill="#1C2216"/>
    <rect x="10" y="10" width="19" height="19" rx="4" fill="#3EA6FF"/>
    <rect x="35" y="10" width="19" height="19" rx="4" fill="#FFB000"/>
    <rect x="10" y="35" width="19" height="19" rx="4" fill="#FF6B6B"/>
    <rect x="35" y="35" width="19" height="19" rx="4" fill="#C77DFF"/>
  </g>

  <!-- title -->
  <text x="80" y="322" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="64" fill="#E9ECE3">Matrix Multiplication on Multiple</text>
  <text x="80" y="398" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="64" fill="#E9ECE3">GPUs</text>

  <!-- kicker / subtitle -->
  <text x="80" y="460" font-family="IBM Plex Mono, monospace" font-weight="500" font-size="26" letter-spacing="1" fill="#A3A996">GPUNINJA &#183; CS217/EE217 CAPSTONE &#183; UC RIVERSIDE</text>

  <!-- accent rule -->
  <rect x="80" y="486" width="64" height="4" fill="#76B900"/>
</svg>